
groups:
  - name: victoria-metrics-vmagent
    interval: 15s
    rules:
      - record: victoria_metrics:vmagent_targets_up
        expr: |
          sum by (instance) (
            up{job=~".*vmagent.*"}
          )

      - record: victoria_metrics:vmagent_targets_down
        expr: |
          sum by (instance) (
            up{job=~".*vmagent.*"} == 0
          )

      - record: victoria_metrics:vmagent_samples_scraped_per_second
        expr: |
          sum by (instance) (
            rate(vm_promscrape_scraped_samples_sum[5m])
          )

      - record: victoria_metrics:vmagent_samples_dropped_per_second
        expr: |
          sum by (instance) (
            rate(vm_promscrape_dropped_samples_sum[5m])
          )

  - name: victoria-metrics-storage
    interval: 15s
    rules:
      - record: victoria_metrics:vmsingle_ingested_rows_per_second
        expr: |
          sum(
            rate(vm_rows_inserted_total[5m])
          )

      - record: victoria_metrics:vmsingle_ingested_bytes_per_second
        expr: |
          sum(
            rate(vm_bytes_received_total[5m])
          )

      - record: victoria_metrics:vmsingle_storage_size_bytes
        expr: |
          sum(vm_data_size_bytes)

  - name: victoria-metrics-queries
    interval: 15s
    rules:
      - record: victoria_metrics:vmsingle_queries_per_second
        expr: |
          sum(
            rate(vm_http_requests_total[5m])
          )

      - record: victoria_metrics:vmsingle_query_duration_seconds
        expr: |
          histogram_quantile(
            0.95,
            sum by (vmrange) (
              rate(vm_request_duration_seconds_bucket[5m])
            )
          )
