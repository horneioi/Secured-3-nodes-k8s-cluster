all:
  children:
    localstack:
      hosts:
        localstack-01:
          ansible_host: "{{ lookup('env', 'LOCALSTACK_NODE_IP') }}"
          ansible_user: "{{ lookup('env', 'VM_USER') }}"
          ansible_become_exe: sudo.ws
    
    kubernetes:
      children:
        control-plane:
          hosts:
            control.node:
              ansible_host: 192.168.0.132
              ansible_become_exe: sudo.ws
        
        workers:
          hosts:
            worker.node:
              ansible_host: 192.168.0.124
              ansible_become_exe: sudo.ws