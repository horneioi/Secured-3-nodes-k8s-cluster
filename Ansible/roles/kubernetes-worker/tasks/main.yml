- name: Check whether worker is already joined
  ansible.builtin.stat:
    path: /etc/kubernetes/kubelet.conf
  register: kubelet_config

- name: Join Kubernetes cluster
  ansible.builtin.command:
    cmd: "{{ hostvars[groups['control-plane'][0]].kubeadm_join_command.stdout }} --cri-socket unix:///run/containerd/containerd.sock"
  when: not kubelet_config.stat.exists
  no_log: true