- name: Install containerd
  ansible.builtin.apt:
    name: "{{ containerd_package }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Ensure containerd configuration directory exists
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Generate default containerd configuration
  ansible.builtin.shell:
    cmd: containerd config default > {{ containerd_config_path }}
    creates: "{{ containerd_config_path }}"

- name: Configure systemd cgroup driver
  ansible.builtin.replace:
    path: "{{ containerd_config_path }}"
    regexp: '^(\s*SystemdCgroup\s*=\s*)false\s*$'
    replace: '\1true'
  notify: Restart containerd

- name: Ensure containerd proxy configuration directory exists
  ansible.builtin.file:
    path: "{{ containerd_proxy_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure containerd systemd proxy
  ansible.builtin.template:
    src: proxy.conf.j2
    dest: "{{ containerd_proxy_dir }}/{{ containerd_proxy_config }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart containerd

- name: Ensure containerd is enabled and running
  ansible.builtin.systemd_service:
    name: containerd
    enabled: true
    state: started