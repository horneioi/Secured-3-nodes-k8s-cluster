- name: Prepare Kubernetes nodes
  ansible.builtin.import_playbook: ../kubernetes/prepare.yml

- name: Configure Kubernetes runtime
  ansible.builtin.import_playbook: ../kubernetes/runtime.yml

- name: Configure Kubernetes tools
  ansible.builtin.import_playbook: ../kubernetes/tools.yml

- name: Initialize Kubernetes control plane
  ansible.builtin.import_playbook: ../kubernetes/control-plane.yml

- name: Install Helm
  ansible.builtin.import_playbook: ../helm.yml
  
- name: Install Kubernetes network
  ansible.builtin.import_playbook: ../kubernetes/network.yml

- name: Join Kubernetes workers
  ansible.builtin.import_playbook: ../kubernetes/worker.yml

- name: Install ArgoCD into Cluster
  ansible.builtin.import_playbook: ../kubernetes/argocd.yml

- name: Install VictoriaMetrics
  ansible.builtin.import_playbook: ../kubernetes/victoria-metrics.yml