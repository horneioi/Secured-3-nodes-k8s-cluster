- name: Download Helm archive
  ansible.builtin.get_url:
    url: "https://get.helm.sh/helm-v{{ helm_version }}-linux-{{ helm_arch }}.tar.gz"
    dest: "/tmp/helm-v{{ helm_version }}-linux-{{ helm_arch }}.tar.gz"
    mode: "0644"

- name: Extract Helm archive
  ansible.builtin.unarchive:
    src: "/tmp/helm-v{{ helm_version }}-linux-{{ helm_arch }}.tar.gz"
    dest: /tmp
    remote_src: true
    creates: "/tmp/linux-{{ helm_arch }}/helm"

- name: Install Helm binary
  ansible.builtin.copy:
    src: "/tmp/linux-{{ helm_arch }}/helm"
    dest: "{{ helm_install_dir }}/helm"
    remote_src: true
    owner: root
    group: root
    mode: "0755"